<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="px-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".4" stop-color="#f59e0b"/>
      <stop offset=".7" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="px-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset=".35" stop-color="#dc2626"/>
      <stop offset=".7" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="px-fire2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="px-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Sol kanat: alttan yukarı süzülen 4 katmanlı tüy demeti (sağa aynalanır) -->
    <g id="px-wing">
      <path d="M118 392 C58 360 28 290 40 210 C62 258 88 290 122 310 C84 262 72 208 86 152 C104 208 130 250 166 278 C140 218 138 162 158 112 C168 172 190 220 224 252 C200 300 170 348 118 392z"
        fill="url(#px-fire)" filter="url(#px-glow)"/>
      <path d="M122 372 C76 344 52 290 58 226 C78 268 100 294 128 312 C100 270 92 226 102 182 C118 228 140 262 168 284 C152 318 140 346 122 372z"
        fill="url(#px-fire2)" opacity=".85"/>
      <path d="M130 350 C100 328 84 292 86 248 C102 280 120 300 142 314 C128 328 132 338 130 350z"
        fill="#fde047" opacity=".55"/>
    </g>

    <!-- Sarkan kor tüy -->
    <g id="px-feather">
      <circle cx="0" cy="0" r="3.5" fill="#fde68a"/>
      <path d="M0 6 C8 18 8 36 0 50 C-8 36 -8 18 0 6z" fill="url(#px-fire)" stroke="#fde047" stroke-width="1" stroke-opacity=".5"/>
      <path d="M0 10 L0 44" stroke="#fde047" stroke-width="1.2" opacity=".7"/>
    </g>
  </defs>

  <!-- Altın çekirdek halka -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#px-gold)" stroke-width="13" filter="url(#px-glow)"/>
  <circle cx="256" cy="256" r="167" fill="none" stroke="#fde047" stroke-width="2" opacity=".6">
    <animate attributeName="opacity" values=".6;.25;.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Anka kanatları -->
  <g>
    <animate attributeName="opacity" values="1;.85;1" dur="2.2s" repeatCount="indefinite"/>
    <use href="#px-wing"/>
    <use href="#px-wing" transform="translate(512 0) scale(-1 1)"/>
  </g>

  <!-- Tepe alev ibiği -->
  <g filter="url(#px-glow)">
    <path d="M256 92 C242 64 246 36 262 14 C268 38 264 58 256 70 C272 52 278 32 274 12 C292 34 292 64 274 88 C268 94 262 94 256 92z"
      fill="url(#px-fire)"/>
    <path d="M238 92 C228 74 230 54 240 38 C244 56 242 70 238 80 C230 88 234 92 238 92z"
      fill="url(#px-fire2)" opacity=".9"/>
    <animate attributeName="opacity" values="1;.75;1" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Alt kuyruk tüyleri -->
  <use href="#px-feather" transform="translate(256 444)"/>
  <use href="#px-feather" transform="translate(214 434) rotate(10) scale(.82)"/>
  <use href="#px-feather" transform="translate(298 434) rotate(-10) scale(.82)"/>
  <use href="#px-feather" transform="translate(178 418) rotate(20) scale(.62)"/>
  <use href="#px-feather" transform="translate(334 418) rotate(-20) scale(.62)"/>

  <!-- Yükselen korlar -->
  <g fill="#fde047" filter="url(#px-glow)">
    <circle cx="96" cy="160" r="4">
      <animate attributeName="cy" values="160;132;160" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.15;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="418" cy="170" r="3.5">
      <animate attributeName="cy" values="170;144;170" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.2;.9" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="84" r="3">
      <animate attributeName="cy" values="84;62;84" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.15;.8" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="92" r="3">
      <animate attributeName="cy" values="92;70;92" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;.2;.85" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
