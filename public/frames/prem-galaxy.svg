<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="gplanet" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset=".6" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </radialGradient>
    <filter id="gglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ana yıldız halkası -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gg)" stroke-width="9" filter="url(#gglow)" opacity=".9"/>
  <circle cx="256" cy="256" r="169" fill="none" stroke="#c7d2fe" stroke-width="1.5" opacity=".5"/>

  <!-- Eğik yörünge elipsi -->
  <g transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="226" ry="84" fill="none" stroke="url(#gg)" stroke-width="4" opacity=".55" filter="url(#gglow)"/>
    <!-- Yörüngede dönen gezegen -->
    <circle r="14" fill="url(#gplanet)" filter="url(#gglow)">
      <animateMotion dur="10s" repeatCount="indefinite"
        path="M482 256 A226 84 0 1 1 30 256 A226 84 0 1 1 482 256"/>
    </circle>
  </g>

  <!-- Sabit yıldızlar -->
  <g fill="#e0e7ff" filter="url(#gglow)">
    <path d="M120 96 l5 12 13 2 -9 9 2 13 -11 -6 -11 6 2 -13 -9 -9 13 -2z">
      <animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M404 116 l4 10 11 1 -8 8 2 11 -9 -5 -9 5 2 -11 -8 -8 11 -1z">
      <animate attributeName="opacity" values=".4;1;.4" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="448" cy="296" r="4">
      <animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="300" r="4">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="368" cy="430" r="5">
      <animate attributeName="opacity" values="1;.3;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
