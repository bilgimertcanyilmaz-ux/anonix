<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="lglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Tek yaprak: merkeze (256,256) göre döndürülerek çoğaltılır -->
    <path id="leaf" d="M256 60 q16 18 0 44 q-16 -26 0 -44z" fill="url(#lg2)"/>
  </defs>

  <!-- Altın taban halkası -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#lg)" stroke-width="10" filter="url(#lglow)"/>

  <!-- Sol defne dalı -->
  <g filter="url(#lglow)">
    <use href="#leaf" transform="rotate(-28 256 256)"/>
    <use href="#leaf" transform="rotate(-52 256 256) scale(1.04) translate(-10 -10)"/>
    <use href="#leaf" transform="rotate(-76 256 256)"/>
    <use href="#leaf" transform="rotate(-100 256 256) scale(1.04) translate(-10 -10)"/>
    <use href="#leaf" transform="rotate(-124 256 256)"/>
    <use href="#leaf" transform="rotate(-148 256 256) scale(1.04) translate(-10 -10)"/>
  </g>
  <!-- Sağ defne dalı -->
  <g filter="url(#lglow)">
    <use href="#leaf" transform="rotate(28 256 256)"/>
    <use href="#leaf" transform="rotate(52 256 256) scale(1.04) translate(10 -10)"/>
    <use href="#leaf" transform="rotate(76 256 256)"/>
    <use href="#leaf" transform="rotate(100 256 256) scale(1.04) translate(10 -10)"/>
    <use href="#leaf" transform="rotate(124 256 256)"/>
    <use href="#leaf" transform="rotate(148 256 256) scale(1.04) translate(10 -10)"/>
  </g>

  <!-- Alt birleşim fiyonku -->
  <circle cx="256" cy="448" r="14" fill="url(#lg)" filter="url(#lglow)"/>
  <circle cx="256" cy="448" r="6" fill="#fff7ed"/>

  <!-- Tepe yıldızı -->
  <g filter="url(#lglow)">
    <path d="M256 18 l10 24 26 3 -19 18 5 26 -22 -13 -22 13 5 -26 -19 -18 26 -3z" fill="url(#lg)">
      <animate attributeName="opacity" values="1;.65;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
