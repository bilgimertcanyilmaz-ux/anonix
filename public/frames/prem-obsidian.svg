<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ob-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset=".25" stop-color="#334155"/>
      <stop offset=".5" stop-color="#64748b"/>
      <stop offset=".75" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="ob-ice" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="ob-horn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".6" stop-color="#334155"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="ob-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Sol taraf süsleri (sağa aynalanır) -->
    <g id="ob-side">
      <!-- Ejder boynuzu -->
      <path d="M84 348 C40 300 30 220 64 150 C70 200 86 232 110 258 C92 216 92 176 108 140 C112 196 130 240 158 272 C132 308 108 336 84 348z"
        fill="url(#ob-horn)" stroke="#22d3ee" stroke-width="2" stroke-opacity=".5" filter="url(#ob-glow)"/>
      <!-- Boynuz kıymığı -->
      <path d="M96 128 l-14 -44 26 18 z" fill="url(#ob-ice)" filter="url(#ob-glow)"/>
      <!-- Yan perçinler -->
      <circle cx="76" cy="262" r="6" fill="#cbd5e1"/>
      <circle cx="92" cy="312" r="5" fill="#94a3b8"/>
    </g>

    <!-- Buz kristali (üst küme için) -->
    <g id="ob-shard">
      <path d="M0 0 L16 -64 L32 0 L16 18 z" fill="url(#ob-ice)" stroke="#cffafe" stroke-width="1.5" stroke-opacity=".6"/>
      <path d="M16 -64 L16 18 L6 4 z" fill="#ffffff" opacity=".22"/>
    </g>

    <!-- Sarkan diş kolyesi -->
    <g id="ob-fang">
      <circle cx="0" cy="0" r="4" fill="#94a3b8"/>
      <circle cx="0" cy="10" r="3.4" fill="#64748b"/>
      <path d="M0 16 C10 26 8 44 0 56 C-8 44 -10 26 0 16z" fill="url(#ob-ice)" stroke="#cffafe" stroke-width="1.2" stroke-opacity=".5"/>
    </g>
  </defs>

  <!-- Ana çelik bant + iç buz çizgisi -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ob-steel)" stroke-width="17"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0f172a" stroke-width="2" opacity=".7"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ob-ice)" stroke-width="3" opacity=".9" filter="url(#ob-glow)">
    <animate attributeName="opacity" values=".9;.5;.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Bant perçinleri -->
  <g fill="#cbd5e1">
    <circle cx="256" cy="76" r="5"/>
    <circle cx="436" cy="256" r="5"/>
    <circle cx="256" cy="436" r="5"/>
    <circle cx="76" cy="256" r="5"/>
  </g>

  <!-- Yan boynuzlar (sol + ayna sağ) -->
  <use href="#ob-side"/>
  <use href="#ob-side" transform="translate(512 0) scale(-1 1)"/>

  <!-- Üst buz tacı: 5 kristal -->
  <g filter="url(#ob-glow)">
    <use href="#ob-shard" transform="translate(240 86) scale(1.3)"/>
    <use href="#ob-shard" transform="translate(196 96) rotate(-16) scale(1.02)"/>
    <use href="#ob-shard" transform="translate(288 92) rotate(16) scale(1.02)"/>
    <use href="#ob-shard" transform="translate(162 112) rotate(-30) scale(.75)"/>
    <use href="#ob-shard" transform="translate(320 104) rotate(30) scale(.75)"/>
    <animate attributeName="opacity" values="1;.8;1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- Alt sarkan dişler -->
  <use href="#ob-fang" transform="translate(256 444)"/>
  <use href="#ob-fang" transform="translate(206 432) rotate(8) scale(.8)"/>
  <use href="#ob-fang" transform="translate(306 432) rotate(-8) scale(.8)"/>

  <!-- Buz parıltıları -->
  <g fill="#cffafe" filter="url(#ob-glow)">
    <circle cx="140" cy="92" r="3.5">
      <animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="386" cy="100" r="3">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="370" r="3">
      <animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
