<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ig2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="iglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Tek buz kristali (üçgen kıymık) -->
    <path id="shard" d="M256 84 l-15 -56 15 -22 15 22 -15 56z" fill="url(#ig2)" stroke="#7dd3fc" stroke-width="1.5"/>
  </defs>

  <!-- Buzlu halka -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#ig)" stroke-width="11" filter="url(#iglow)" opacity=".95"/>
  <circle cx="256" cy="256" r="167" fill="none" stroke="#e0f2fe" stroke-width="2" opacity=".6"/>

  <!-- Kristal kıymıklar — taç gibi tüm çevrede -->
  <g filter="url(#iglow)">
    <use href="#shard" transform="scale(1.25) translate(-51 -51)"/>
    <use href="#shard" transform="rotate(30 256 256)"/>
    <use href="#shard" transform="rotate(60 256 256) scale(1.1) translate(-23 -23)"/>
    <use href="#shard" transform="rotate(90 256 256)"/>
    <use href="#shard" transform="rotate(120 256 256) scale(1.1) translate(-23 -23)"/>
    <use href="#shard" transform="rotate(150 256 256)"/>
    <use href="#shard" transform="rotate(180 256 256) scale(1.15) translate(-33 -33)"/>
    <use href="#shard" transform="rotate(210 256 256)"/>
    <use href="#shard" transform="rotate(240 256 256) scale(1.1) translate(-23 -23)"/>
    <use href="#shard" transform="rotate(270 256 256)"/>
    <use href="#shard" transform="rotate(300 256 256) scale(1.1) translate(-23 -23)"/>
    <use href="#shard" transform="rotate(330 256 256)"/>
  </g>

  <!-- Parlayan kar taneleri -->
  <g fill="#f0f9ff" filter="url(#iglow)">
    <circle cx="120" cy="150" r="4">
      <animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="140" r="5">
      <animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="330" r="4">
      <animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="340" r="5">
      <animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
