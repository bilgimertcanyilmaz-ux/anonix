# Codemagic CI/CD — Anonix iOS build + TestFlight upload.
#
# KULLANICI TARAFI KURULUM:
#   1. https://codemagic.io üye ol (GitHub ile)
#   2. Anonix repo'yu seç → "Add application"
#   3. Settings → Integrations:
#       a) "Apple Developer Portal" → App Store Connect API Key bağla
#          (App Store Connect > Users and Access > Keys > "+" → Admin role)
#       b) "iOS code signing" → Codemagic'in otomatik signing'i seç
#   4. Environment variables (Sensitive olarak işaretle):
#       - APP_STORE_CONNECT_PRIVATE_KEY   (P8 dosyasının içeriği)
#       - APP_STORE_CONNECT_KEY_IDENTIFIER
#       - APP_STORE_CONNECT_ISSUER_ID
#       - CERTIFICATE_PRIVATE_KEY         (P12 password — Codemagic auto-generate)
#   5. App Store Connect'te Anonix app record'u oluştur (Bundle ID: com.anonix.app)
#   6. Bu workflow'u trigger et: main'e push veya manuel.

workflows:
  ios-testflight:
    name: Anonix iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic UI > Teams > Integrations > App Store Connect bağlarken
      # verdiğin integration adı ile BİREBİR aynı olmalı.
      app_store_connect: codemagic
    environment:
      # NOT: ios_signing bloğu BİLEREK kaldırıldı. O blok, build makinesi
      # hazırlanırken (scripts'ten ÖNCE) otomatik imzalamayı tetikliyor ve
      # yeni bundle ID'de profil olmadığından build daha başlamadan patlıyordu.
      # İmzalamayı tamamen "Set up code signing" script adımı yönetiyor:
      # sertifikayı + profili API ile oluşturup keychain'e ekliyor.
      vars:
        BUNDLE_ID: "com.anonix.app"
        # Capacitor 8 iOS'u CocoaPods yerine Swift Package Manager (SPM) kullanıyor:
        # .xcworkspace YOK → doğrudan .xcodeproj ile build alınır.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID  # App Store Connect'teki Apple ID (e-posta)
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Capacitor sync iOS
        script: |
          set -x
          echo "=== Ortam kontrolü ==="
          node --version
          npx cap --version || echo "cap CLI bulunamadı"
          echo "=== webDir kontrolü ==="
          ls -la mobile-shell/dist || echo "HATA: mobile-shell/dist yok"
          echo "=== iOS platform kontrolü ==="
          ls -la ios/App || echo "HATA: ios/App yok"
          echo "=== cap doctor ==="
          npx cap doctor ios || true
          echo "=== cap sync (stderr birleşik) ==="
          # Hatayı stdout'a yönlendir ki Codemagic loglarında görünsün.
          npx cap sync ios 2>&1
          echo "=== cap sync bitti, exit kodu: $? ==="

      - name: Pod install (yalnızca CocoaPods kullanılıyorsa)
        script: |
          # Capacitor 8 SPM kullanıyor; Podfile yoksa bu adımı atla.
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
            cd ../..
          else
            echo "Podfile yok — proje Swift Package Manager (SPM) kullanıyor, pod install atlandı."
          fi

      - name: Set up code signing (fetch + create if missing)
        script: |
          # Tüm çıktıyı artifact'a giren bir log dosyasına da yaz (signing.log).
          mkdir -p /tmp/xcodebuild_logs
          exec > >(tee /tmp/xcodebuild_logs/signing.log) 2>&1

          set -e
          echo "########## ADIM 1: keychain initialize ##########"
          keychain initialize

          echo "########## ADIM 2: dağıtım sertifikası için RSA private key üret ##########"
          # fetch-signing-files yeni distribution certificate oluştururken
          # bir private key gerektiriyor (loglardan tespit edildi:
          # 'Cannot create resource without certificate private key').
          CERT_KEY=/tmp/dist_certificate_key.pem
          ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY" -q -N ""
          echo "private key üretildi: $CERT_KEY"

          echo "########## ADIM 2.5: kullanılamayan eski distribution sertifikalarını revoke et ##########"
          # Önceki build'ler her seferinde farklı RSA key ürettiği için Apple'da
          # private key'i kayıp distribution sertifikaları birikti (limit: 409).
          # Bunlar kullanılamaz; temizleyip tek temiz sertifika oluşturacağız.
          # Sertifikalar modern "Apple Distribution" (DISTRIBUTION) tipinde olabilir,
          # eski IOS_DISTRIBUTION değil. Her iki tipi de listeleyip revoke et.
          for CTYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            app-store-connect certificates list --type "$CTYPE" --json > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
            echo "--- $CTYPE certs.json ---"; cat /tmp/certs.json; echo "--- son ---"
            for CID in $(python3 -c "import json; d=json.load(open('/tmp/certs.json')); items=d if isinstance(d,list) else d.get('data',[]); print(' '.join((x.get('id') or x.get('_id') or '') for x in items))" 2>/dev/null); do
              echo "Revoking certificate $CID ($CTYPE)"
              app-store-connect certificates delete "$CID" || echo "revoke atlandı: $CID"
            done
          done
          echo "Revoke aşaması bitti."

          echo "########## ADIM 3: fetch-signing-files (private key ile --create) ##########"
          app-store-connect fetch-signing-files "com.anonix.app" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create

          echo "########## ADIM 4: keychain add-certificates ##########"
          # İndirilen .p12 sertifikaları otomatik bulunur — ek parametre yok.
          keychain add-certificates

          echo "########## ADIM 5: xcode-project use-profiles ##########"
          xcode-project use-profiles

          echo "########## SIGNING TAMAMLANDI ##########"

      - name: Increment build number
        script: |
          cd ios/App
          # get-latest-build-number TÜM yüklenen build'lerin (TestFlight dahil) en
          # yüksek numarasını verir. (get-latest-app-store-build-number ise yalnızca
          # YAYINDAKI sürüme bakar; uygulama henüz yayında olmadığı için 0 dönüp
          # build numarasını 1'de bırakıyordu → "bundle version already used" hatası.)
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "1")
          # Güvenlik: boş/sıfır gelirse en az 1 kabul et, sonra +1.
          if [ -z "$LATEST_BUILD" ] || [ "$LATEST_BUILD" -lt 1 ]; then LATEST_BUILD=1; fi
          NEW_BUILD=$(($LATEST_BUILD + 1))
          echo "En son build numarası: $LATEST_BUILD → yeni: $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD
          cd ../..

      - name: Build .ipa
        script: |
          # build-ipa'nın TÜM çıktısını artifact'a giren bir log dosyasına yaz.
          mkdir -p /tmp/xcodebuild_logs
          exec > >(tee /tmp/xcodebuild_logs/buildipa.log) 2>&1
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" || {
              echo ""
              echo "########## BUILD .IPA BAŞARISIZ — xcodebuild log (son 150 satır) ##########"
              LOG=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -v buildipa | head -1)
              if [ -n "$LOG" ]; then
                tail -150 "$LOG"
              else
                echo "xcodebuild log dosyası bulunamadı."
              fi
              echo "########## LOG SONU ##########"
              exit 1
            }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # .ipa'yı App Store Connect / TestFlight'a yükle.
        # beta_groups KALDIRILDI: o grup henüz yok ve external test review bilgisi
        # gerektiriyordu (build'i fail ettiriyordu). Build internal testing'e yine
        # yüklenir; tester atamasını App Store Connect panelinden yaparsın.
        submit_to_testflight: true
        # App Store review'a otomatik göndermez (manuel tetiklenir).
        submit_to_app_store: false
      email:
        recipients:
          - bilgi.mertcanyilmaz@gmail.com
        notify:
          success: true
          failure: true
